# Session A: Bodhan Gemma-4 QLoRA (primary run).
# Deep-merged on top of configs/base.yaml via
# mr_mt.config.load_base_and_session. Only overrides are listed here.

run:
  name: sessionA_bodhan_qlora
  output_dir: /kaggle/working/sessionA

lora:
  r: 32
  alpha: 64
  dropout: 0.05

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  max_steps: 1000
  # Checkpoint after every 5 optimizer steps.  This deliberately happens
  # before the long run so a new Kaggle VM can prove step-1 and resume.
  save_steps: 5
  eval_steps: 5
  logging_steps: 1
  logging_dir: /kaggle/working/sessionA/logs
  # TRL 1.6 rejects a row whose gated Gemma template renders an empty
  # assistant mask, even though generation markers are present in the
  # template. Train the full conversation until the tokenizer's template is
  # corrected; this avoids another 30-minute pre-tokenization failure.
  assistant_only_loss: false
  # Temporary smoke-run gate: change max_steps to the full run only after the
  # first optimizer step and checkpoint save are verified on Kaggle.
  max_steps: 20

hub:
  push_to_hub: false
  repo_id: "your-hf-user/indic-translate-mr-education-lora"

checkpointing:
  mirror_dir: /kaggle/working/sessionA/checkpoint_mirror
  adapter_only_copy: false
  rclone_remote: "gdrive:mr-mt-edu-2026/bodhan-qlora/checkpoints"
