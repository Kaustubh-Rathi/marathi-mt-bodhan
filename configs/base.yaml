run:
  name: base
  seed: 42
  output_dir: /kaggle/working/run

model:
  name: bodhan-ai/indic-translate
  trust_remote_code: true
  load_in_4bit: true
  bnb:
    quant_type: nf4
    double_quant: true
    compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  bias: none
  target_modules: all-linear
  exclude_modules:
    - vision_tower
    - visual
    - image_encoder
    - audio_tower
    - embed_vision
    - embed_audio
    - lm_head
  modules_to_save:
    - lm_head
    - embed_tokens

training:
  max_seq_length: 1024
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_ratio: 0.03
  max_steps: 1000
  num_train_epochs: 0
  save_steps: 100
  save_total_limit: null  # keep ALL checkpoints; CheckpointMirrorCallback prunes
                          # local copies only AFTER their Drive upload is confirmed
                          # (trainer-side rotation could delete an in-flight upload)
  save_only_model: false  # resumeable (adapter + optimizer + scheduler + RNG)
  eval_steps: 100
  logging_steps: 10
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  weight_decay: 0.01
  max_grad_norm: 1.0
  report_to:
    - tensorboard
  logging_dir: /kaggle/working/run/logs
  packing: false
  assistant_only_loss: true

data:
  train_file: data/processed/train.jsonl
  dev_file: data/processed/dev.jsonl
  test_file: data/processed/test.jsonl
  source_lang: eng_Latn
  target_lang: mar_Deva
  source_lang_name: English
  target_lang_name: Marathi
  prompt_template: "Translate the following {src_lang_name} text to {tgt_lang_name}:\n{src}"

hub:
  push_to_hub: false
  repo_id: ""
  strategy: all_checkpoints
  private: true

checkpointing:
  # Full (resumeable) checkpoints are uploaded to Drive in the BACKGROUND by
  # CheckpointMirrorCallback (requires rclone_remote + rclone + gdrive creds).
  # A _upload_complete marker is touched after each verified upload; resume
  # from the highest remote checkpoint that has the marker.
  # keep_local bounds /kaggle/working disk: confirmed-uploaded checkpoints
  # beyond the newest keep_local are deleted locally (Drive keeps all).
  # adapter_only_copy: true switches to small adapter-only mirrors instead
  # (NOT resumable - no optimizer/scheduler/RNG state).
  # Without rclone_remote, checkpoints stay on the VM for the post-run sync
  # (scripts/pull_kaggle_output.ps1 -> scripts/sync_drive.ps1).
  mirror_dir: /kaggle/working/run/checkpoint_mirror  # only used if adapter_only_copy
  adapter_only_copy: false
  rclone_remote: ""
  rclone_binary: rclone
  keep_local: 2
  max_pending: 2

prepare:
  dataset: ai4bharat/samanantar
  hf_dataset_config: mr
  direction: eng_Latn->mar_Deva
  raw_dir: data/raw/samanantar
  max_train: 8000
  max_dev: 1000
  min_words: 1
  max_words: 100
  dedup: true
  near_dup_threshold: 0.9
  seed: 42

eval:
  max_new_tokens: 256
  num_beams: 5
  batch_size: 8
  benchmarks:
    # VERIFIED via HF datasets-server (2026-09): ai4bharat/IN22-Gen has ONE
    # config ('default', pass null) and ONE split ('test'); the 'default'
    # config carries sentence_<lang> columns for all 22 languages.
    - name: in22_gen
      dataset: ai4bharat/IN22-Gen
      config: null
      split: test
      src_lang: eng_Latn
      tgt_lang: mar_Deva
    # VERIFIED via HF datasets-server (2026-09): facebook/flores has a
    # hyphenated 'eng_Latn-mar_Deva' pairing config with dev/devtest splits.
    # flores is gated ('auto') — accept its conditions with the token account.
    - name: flores_devtest
      dataset: facebook/flores
      config: eng_Latn-mar_Deva
      split: devtest
      src_lang: eng_Latn
      tgt_lang: mar_Deva
