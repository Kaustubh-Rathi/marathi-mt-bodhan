# Session B — fallback: IndicTrans2 LoRA (eng_Latn -> mar_Deva).
# Deep-merged on top of configs/base.yaml via mr_mt.config.load_base_and_session.
# Session B runs on a SEPARATE env from Session A (see requirements.txt):
# transformers>=4.33.2,<5 + IndicTransToolkit==1.1.1, because the IndicTrans2
# huggingface_interface is incompatible with transformers>=5.
# Uses the En-Indic distilled checkpoint (indictrans2-en-indic-dist-200M):
# training direction is English -> Marathi. NOTE: this repo is gated ('auto') —
# accept its conditions once with the HF_TOKEN account before running.

run:
  name: sessionB_indictrans2_lora
  output_dir: /kaggle/working/sessionB

model:
  name: ai4bharat/indictrans2-en-indic-dist-200M
  trust_remote_code: true
  load_in_4bit: false

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  max_seq_length: 128
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: inverse_sqrt
  lr_scheduler_kwargs: {}  # override base cosine-only min_lr_rate (meaningless for inverse_sqrt)
  warmup_steps: 150
  warmup_ratio: 0
  max_steps: 20
  save_steps: 5
  eval_steps: 5
  logging_steps: 1
  logging_dir: /kaggle/working/sessionB/logs
  fp16: true
  bf16: false
  gradient_checkpointing: false
  # optim=adamw_torch uses the torch defaults; no explicit betas key so the
  # optimizer default betas=(0.9, 0.999) apply.
  optim: adamw_torch
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_total_limit: null
  save_only_model: false
  # Loss-only eval during training; beam-5 generation every 500 steps over the
  # dev set is a 20-50 min sink. Generation metrics come from mr_mt.evaluate.
  predict_with_generate: false
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false

checkpointing:
  mirror_dir: /kaggle/working/sessionB/checkpoint_mirror
  adapter_only_copy: false
  rclone_remote: "gdrive:mr-mt-edu-2026/indictrans2-lora/checkpoints"
